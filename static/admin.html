<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>렉시오 관리자</title>
<style>
  :root{--bg:#0b0f1a;--bg2:#141d30;--panel:#19233a;--panel2:#212e49;--line:#31425f;
    --txt:#eaf1fb;--mut:#92a3bd;--accent:#ffd24a;--good:#39df84;--bad:#ff6b6b;}
  *{box-sizing:border-box;}
  body{margin:0;color:var(--txt);font-family:"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:linear-gradient(170deg,var(--bg),var(--bg2));min-height:100vh;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 24px;max-width:900px;margin:0 auto;}
  h1{font-size:22px;text-align:center;margin:6px 0 2px;color:var(--accent);letter-spacing:1px;}
  .sub{text-align:center;color:var(--mut);font-size:12px;margin-bottom:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);}
  input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0f1626;color:var(--txt);font-size:15px;}
  button{cursor:pointer;font-family:inherit;border:none;border-radius:11px;font-weight:800;}
  .btn{width:100%;padding:14px;font-size:16px;background:linear-gradient(180deg,#ffe07a,#ffb01e);color:#3a2600;margin-top:8px;}
  .btn.s{background:var(--panel2);color:var(--txt);border:1px solid var(--line);}
  .stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .stat .b{flex:1;min-width:100px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
  .stat .b .n{font-size:22px;font-weight:900;color:var(--accent);}
  .stat .b .l{font-size:11px;color:var(--mut);margin-top:2px;}
  .sec-title{font-weight:800;margin:4px 0 8px;font-size:15px;}
  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:380px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;}
  th{color:var(--mut);font-weight:700;position:sticky;top:0;background:var(--panel);}
  td.name{font-weight:700;text-align:left;}
  .win{color:var(--good);font-weight:700;}
  .pos{color:var(--good);} .neg{color:var(--bad);}
  .pill{display:inline-block;background:#2a3858;border-radius:6px;padding:1px 6px;margin:1px;font-size:11px;}
  .pill.w{background:#3a3417;color:var(--accent);}
  .err{color:var(--bad);text-align:center;margin-top:8px;font-size:13px;}
  .mode{text-align:center;font-size:12px;margin-bottom:10px;}
  .mode b{color:var(--accent);}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
  .toprow button{width:auto;padding:9px 14px;font-size:13px;}
  .hidden{display:none!important;}
  .grow{font-size:12px;color:var(--mut);margin-top:3px;}
</style>
</head>
<body>
<h1>🛠️ 렉시오 관리자</h1>
<div class="sub">회원 정보 · 게임 내역 (영구 누적)</div>

<div id="loginCard" class="card">
  <div class="sec-title">관리자 로그인</div>
  <input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password">
  <button class="btn" id="loginBtn">조회</button>
  <div class="err" id="err"></div>
  <div class="grow">※ 비밀번호는 서버의 <b>ADMIN_PASSWORD</b> 환경변수로 설정합니다(기본값: lexio-admin). Render → Environment에서 바꾸세요.</div>
</div>

<div id="dash" class="hidden">
  <div class="toprow">
    <div class="mode">저장소: <b id="mode">-</b></div>
    <button class="btn s" id="refresh" style="width:auto;">새로고침</button>
  </div>
  <div class="stat">
    <div class="b"><div class="n" id="sUsers">0</div><div class="l">총 회원</div></div>
    <div class="b"><div class="n" id="sGames">0</div><div class="l">총 게임수</div></div>
    <div class="b"><div class="n" id="sOnline">0</div><div class="l">접속중</div></div>
    <div class="b"><div class="n" id="sRooms">0</div><div class="l">방</div></div>
  </div>

  <div class="card">
    <div class="sec-title">👤 회원 목록 (게임수 순)</div>
    <div class="tablewrap">
      <table id="userTbl"><thead><tr><th>#</th><th>아이디</th><th>게임수</th><th>승리</th><th>승률</th><th>가입일</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">📜 게임 내역 (최근순)</div>
    <div class="tablewrap">
      <table id="gameTbl"><thead><tr><th>시각</th><th>방</th><th>승자</th><th>결과(순위·점수)</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
let savedPw="";
async function load(pw){
  const err=document.getElementById("err");
  err.textContent="";
  try{
    const r=await fetch("/admin/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
    const d=await r.json();
    if(!d.ok){ err.textContent=d.msg||"오류"; return; }
    savedPw=pw;
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("dash").classList.remove("hidden");
    render(d);
  }catch(e){ err.textContent="서버 연결 오류"; }
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(d){
  document.getElementById("mode").textContent=d.storage;
  document.getElementById("sUsers").textContent=d.users.length;
  document.getElementById("sGames").textContent=d.games.length;
  document.getElementById("sOnline").textContent=d.online;
  document.getElementById("sRooms").textContent=d.rooms;
  // 회원
  const ub=document.querySelector("#userTbl tbody"); ub.innerHTML="";
  d.users.forEach((u,i)=>{
    const rate=u.games?Math.round(u.wins/u.games*100):0;
    ub.insertAdjacentHTML("beforeend",
      `<tr><td>${i+1}</td><td class="name">${esc(u.name)}</td><td>${u.games}</td>
       <td class="win">${u.wins}</td><td>${rate}%</td><td>${esc(u.created||"-")}</td></tr>`);
  });
  if(!d.users.length) ub.innerHTML=`<tr><td colspan="6" style="color:var(--mut)">아직 회원이 없습니다</td></tr>`;
  // 게임
  const gb=document.querySelector("#gameTbl tbody"); gb.innerHTML="";
  d.games.forEach(g=>{
    const parts=(g.detail||[]).map((p,idx)=>{
      const cls=p.score>0?"pos":p.score<0?"neg":"";
      const w=p.isWinner?" w":"";
      const sign=p.score>0?"+":"";
      return `<span class="pill${w}">${idx+1}. ${esc(p.name)}${p.isAI?"🤖":""} <span class="${cls}">${sign}${p.score}</span></span>`;
    }).join(" ");
    gb.insertAdjacentHTML("beforeend",
      `<tr><td>${esc(g.ts)}</td><td>${esc(g.room)}</td><td class="win">${esc(g.winner)}</td><td style="text-align:left;white-space:normal">${parts}</td></tr>`);
  });
  if(!d.games.length) gb.innerHTML=`<tr><td colspan="4" style="color:var(--mut)">아직 게임 기록이 없습니다</td></tr>`;
}
document.getElementById("loginBtn").onclick=()=>load(document.getElementById("pw").value);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")load(document.getElementById("pw").value);});
document.getElementById("refresh").onclick=()=>load(savedPw);
</script>
</body>
</html>
