# Render.com 배포 설정 (무료 플랜, 고정 주소)
# 배포 순서는 README.txt 의 "클라우드 배포" 참고.
# 계정 영구 보관을 위해 DATABASE_URL(무료 Neon Postgres)을 연결합니다.
services:
  - type: web
    name: lexio-online
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false   # Neon 연결 문자열을 Render 대시보드에서 입력(비밀로 보관)
      - key: ADMIN_PASSWORD
        sync: false   # 관리자 페이지(/admin) 비밀번호. 미설정 시 기본값 lexio-admin
